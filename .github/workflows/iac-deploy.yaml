name: iac deploy

# Manual only. Building this environment costs money and takes 20 minutes,
# so it never runs off a push.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'plan shows the diff, apply builds it'
        type: choice
        default: plan
        options: [plan, apply]
      home_ip:
        description: 'CIDR allowed to reach the EKS API. Get it with ./set-entry.sh --print'
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.5.7'   # must match local terraform, state format is not backward compatible
  AWS_REGION: us-east-1
  # IAM role ARNs are deterministic (arn:...:role/<fixed name>), so they
  # survive a destroy and rebuild unchanged. Hardcoded rather than kept in
  # a repo variable, where an unset value silently becomes an empty input.
  TERRAFORM_ROLE: arn:aws:iam::921017758824:role/notes-app-github-terraform
  STATE_BUCKET: notes-app-tfstate-921017758824
  STATE_KEY: notes-app/terraform.tfstate
  LOCK_TABLE: notes-app-tfstate-lock

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.action == 'apply' && 'production' || 'plan' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Idempotent. State has to live somewhere before init can run, and
      # that somewhere cannot itself be managed by this terraform.
      - name: bootstrap state backend
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "creating state bucket"
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          else
            echo "state bucket already exists"
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" >/dev/null 2>&1; then
            echo "creating lock table"
            aws dynamodb create-table --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE"
          else
            echo "lock table already exists"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

      # Not stored as a repo variable on purpose: it changes constantly and
      # this repository is public. Supplied per run instead.
      - name: check home_ip
        run: |
          IP="${{ inputs.home_ip }}"
          if ! [[ "$IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]; then
            echo "::error::home_ip must be a CIDR like 203.0.113.7/32, got '$IP'"
            exit 1
          fi
          echo "TF_VAR_home_ip=$IP" >> "$GITHUB_ENV"
          echo "EKS API will be reachable from $IP"

      - name: plan
        id: plan
        working-directory: terraform
        run: |
          terraform plan -input=false -out=tfplan -no-color | tee plan.txt
          {
            echo "## Terraform plan"
            echo '```'
            tail -40 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            terraform/tfplan
            terraform/plan.txt
          retention-days: 30

      # Applies the reviewed plan file, not a fresh one. A re-plan at apply
      # time could differ from what was approved.
      - name: apply
        if: inputs.action == 'apply'
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: outputs
        if: inputs.action == 'apply'
        working-directory: terraform
        run: |
          {
            echo "## Environment"
            echo '```'
            terraform output
            echo '```'
            echo ""
            echo "Set these repository variables before using the other pipelines:"
            echo '```'
            echo "gh variable set AWS_DEPLOY_ROLE  --body $(terraform output -raw github_deploy_role_arn)"
            echo "gh variable set AWS_PROWLER_ROLE --body $(terraform output -raw prowler_role_arn)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
