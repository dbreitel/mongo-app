name: build and push image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also roll the new image out to the EKS cluster'
        type: boolean
        default: false

# a second push while one is in flight would race on the :latest tag
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          # build and verify on PRs, publish only on main and tags
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: verify wizexercise.txt is in the built image
        run: |
          # -s catches an empty file, which a bare cat would pass silently
          docker run --rm "$IMAGE:${{ github.sha }}" \
            sh -c 'test -s /app/wizexercise.txt && cat /app/wizexercise.txt'

      # Reports only. The environment carries deliberate weaknesses, so a
      # hard gate here would keep the pipeline permanently red.
      - name: scan image with trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: json
          output: trivy-image-full.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      # Trivy emits an entry per scanned target including the clean ones,
      # which is mostly noise. Keep only targets that actually have findings.
      - name: reduce report to findings only
        if: always()
        run: |
          jq '{
            image:     .ArtifactName,
            scanned_at: .CreatedAt,
            severity:  "HIGH,CRITICAL",
            finding_count: ([.Results[]?.Vulnerabilities[]?] | length),
            results: [
              .Results[]?
              | select((.Vulnerabilities // []) | length > 0)
              | {
                  target: .Target,
                  type:   .Type,
                  vulnerabilities: [
                    .Vulnerabilities[]
                    | {
                        id: .VulnerabilityID,
                        severity: .Severity,
                        package: .PkgName,
                        installed: .InstalledVersion,
                        fixed: (.FixedVersion // "no fix available"),
                        path: (.PkgPath // "os package"),
                        title: .Title,
                        url: .PrimaryURL
                      }
                  ]
                }
            ]
          }' trivy-image-full.json > trivy-image-findings.json

          echo "## Image scan (HIGH, CRITICAL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Findings: $(jq -r .finding_count trivy-image-findings.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '| Severity | CVE | Package | Installed | Fixed |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[].vulnerabilities[]
            | "| \(.severity) | \(.id) | \(.package) | \(.installed) | \(.fixed) |"' \
            trivy-image-findings.json >> "$GITHUB_STEP_SUMMARY"

      - name: upload scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-image-report-${{ github.sha }}
          path: trivy-image-findings.json
          retention-days: 30

  # Opt in only. Runs on a manual dispatch with deploy=true, so an ordinary
  # push to main builds and publishes but never touches the cluster.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      - name: kubeconfig
        run: aws eks update-kubeconfig --name test7-db --region us-east-1

      # Deployed by digest, not by a tag. :latest is mutable, so a pod
      # restart could otherwise pick up different code than was built here.
      - name: roll out the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@${{ needs.build.outputs.digest }}"
          echo "deploying $IMAGE"
          kubectl set image deployment/notes-app notes-app="$IMAGE"
          kubectl rollout status deployment/notes-app --timeout=5m

      - name: confirm what is running
        run: |
          kubectl get deployment notes-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          kubectl exec deploy/notes-app -- cat /app/wizexercise.txt
