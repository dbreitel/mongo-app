name: iac scan

on:
  pull_request:
    branches: [main]
    paths: ['terraform/**', 'k8s/**', 'Dockerfile', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['terraform/**', 'k8s/**', 'Dockerfile', '.github/workflows/**']
  schedule:
    # weekly, so new rules land against unchanged code
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: fmt and validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      # Reports only, deliberately. This environment carries required
      # misconfigurations (public S3, SSH from 0.0.0.0/0, admin instance
      # profile, IMDSv1). A blocking gate would sit red forever and get
      # switched off, which is worse than a visible finding list.
      - name: scan terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy-terraform.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-terraform.sarif
          category: trivy-terraform

      - name: summary
        if: always()
        run: |
          {
            echo '## Terraform misconfigurations'
            echo '```'
            docker run --rm -v "$PWD:/src" aquasec/trivy:latest config /src/terraform \
              --severity HIGH,CRITICAL --quiet --format table 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scan kubernetes manifests and Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-k8s.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          skip-dirs: terraform

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-k8s.sarif
          category: trivy-k8s

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # this one DOES fail the build. A committed credential is never
      # an intentional part of the exercise.
      - name: scan for committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
